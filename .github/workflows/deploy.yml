name: Deploy to Demo Server

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H devx.sibers.com >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh bekbosun@devx.sibers.com << 'EOF'
            cd /var/www/vhosts/sultan-bekbosun/sultan-bekbosun.devx.sibers.com
            git pull origin development
            composer install
            php bin/console doctrine:migrations:migrate --no-interaction
            php bin/console cache:clear
          EOF
