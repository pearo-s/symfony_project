services:
  app:
    build: .
    container_name: symfony_app
    ports:
      - "8001:8000"
    volumes:
      - .:/var/www
    environment:
      APP_ENV: dev
    depends_on:
      - db
    links:
      - db
    networks:
      - symfony_network

  db:
    image: mysql:8
    container_name: symfony_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symfony
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    networks:
      - symfony_network

networks:
  symfony_network:
    driver: bridge